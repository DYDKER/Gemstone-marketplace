[project]
name = "gemstone-marketplace"
version = "0.1.0"
requires-python = ">=3.13, <3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
  target-version = "py313"
  line-length = 88
  src = ["services"]

  [tool.ruff.lint]
  select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
  ignore = ["E501"]

[tool.ruff.lint.isort]
  known-first-party = [
      "auth_service",
      "catalog_service",
      "chat_service",
      "notification_service",
      "order_service",
      "payment_service",
      "scheduler_service",
  ]

  [tool.ruff.format]
  quote-style = "double"
  indent-style = "space"
  line-ending = "auto"

  [tool.mypy]
  python_version = "3.13"
  strict = true
  files = ["services"]
  exclude = ["\\.venv", "\\.git"]
  show_error_codes = true

  [tool.pytest.ini_options]
  testpaths = ["services"]
  python_files = ["test_*.py", "*_test.py"]
  addopts = "-ra"

[tool.uv.workspace]
members = [
    "services/auth-service",
]
