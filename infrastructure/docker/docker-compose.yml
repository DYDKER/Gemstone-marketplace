  services:
    postgres:
      image: postgres:16-alpine
      container_name: gemstone-postgres
      environment:
        POSTGRES_DB: auth_db
        POSTGRES_USER: auth_user
        POSTGRES_PASSWORD: auth_password
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
        interval: 5s
        timeout: 5s
        retries: 5

  volumes:
    postgres_data: