repos:
    - repo: local
      hooks:
        - id: ruff-check
          name: Ruff check
          entry: uv run ruff check .
          language: system
          pass_filenames: false

        - id: ruff-format
          name: Ruff format check
          entry: uv run ruff format --check .
          language: system
          pass_filenames: false

        - id: mypy
          name: Mypy
          entry: uv run mypy services
          language: system
          pass_filenames: false